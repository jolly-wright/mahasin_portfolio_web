<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>
<title>Md. Mahasin Al Muhi | Portfolio</title>
<!-- Robotic / technical typography -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap"
    rel="stylesheet"
>
<link
    rel="stylesheet"
    href="index.css"
>
</head>
<body>
<main id="app">
<section
    id="hero-section"
    class="portfolio-section"
>
    <div id="topology-world">
    <!-- HERO BACKGROUND VIDEO -->
    <video
        id="space-background"
        autoplay
        muted
        loop
        playsinline
        preload="metadata"
    >
        <source
            src="assets/nebula.webm"
            type="video/webm"
        >
    </video>
    <svg
        id="topology"
        viewBox="0 0 900 900"
        preserveAspectRatio="xMidYMid meet"
        aria-label="Autonomous systems topology"
    >
        <defs>
            <radialGradient
                id="core-inner-gradient"
                cx="50%"
                cy="50%"
                r="70%"
            >
                <stop
                    offset="0%"
                    stop-color="#4a3438"
                />
                <stop
                    offset="35%"
                    stop-color="#302326"
                />
                <stop
                    offset="68%"
                    stop-color="#171013"
                />
                <stop
                    offset="100%"
                    stop-color="#080409"
                />
            </radialGradient>
            <!-- RED GLOW -->
            <filter
                id="red-glow"
                x="-100%"
                y="-100%"
                width="300%"
                height="300%"
            >
                <feGaussianBlur
                    stdDeviation="5"
                    result="blur"
                />
                <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
            <!-- STRONG RED GLOW -->
            <filter
                id="strong-red-glow"
                x="-100%"
                y="-100%"
                width="300%"
                height="300%"
            >
                <feGaussianBlur
                    stdDeviation="10"
                    result="blur"
                />
                <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
            <!-- WHITE GLOW -->
            <filter
                id="white-glow"
                x="-100%"
                y="-100%"
                width="300%"
                height="300%"
            >
                <feGaussianBlur
                    stdDeviation="7"
                    result="blur"
                />
                <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
            <!-- BACKGROUND GLOW -->
            <radialGradient
                id="background-glow"
                cx="50%"
                cy="50%"
                r="65%"
            >
                <stop
                    offset="0%"
                    stop-color="#5d0a17"
                    stop-opacity="0.40"
                />
                <stop
                    offset="50%"
                    stop-color="#260611"
                    stop-opacity="0.22"
                />
                <stop
                    offset="100%"
                    stop-color="#030207"
                    stop-opacity="0"
                />
            </radialGradient>
        </defs>
        <!-- FLOOR -->
        <g id="floor"></g>
        <!-- REDSTONE -->
        <g id="redstone-background"></g>
        <!-- PCB TRACES -->
        <g id="pcb-traces"></g>
        <!-- VIAS -->
        <g id="vias"></g>
        <!-- OUTER HEXAGON -->
        <path
            id="outer-hexagon"
            d="
                M 450 90
                L 760 270
                L 760 630
                L 450 810
                L 140 630
                L 140 270
                Z
            "
        />
        <path
            id="outer-beam"
            d="
                M 450 90
                L 760 270
                L 760 630
                L 450 810
                L 140 630
                L 140 270
                Z
            "
        />
        <!-- CONTROL CORE -->
        <g id="control-core"></g>
    </svg>
    <!-- HTML NODE LAYER -->
    <div id="node-overlay"></div>
</div>
</section>
</main>
<script src="index.js"></script>
</body>
</html>
